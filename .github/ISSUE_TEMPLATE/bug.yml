name: Bug
description: kyoto or Kyoto Home did something wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: command
    attributes:
      label: Command and full output
      render: text
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: "`bun kyoto doctor` output (serial removed)"
      render: text
