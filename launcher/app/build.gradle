plugins { id "com.android.application" }

android {
    namespace "com.kyoto.home"
    compileSdk 34
    defaultConfig {
        applicationId "com.kyoto.home"
        minSdk 26          // Android TV 8.0+; Typeface resources need API 26
        targetSdk 29       // sideloaded only; 29 keeps package visibility simple on newer TVs
        versionCode 2
        versionName "0.2.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
            signingConfig signingConfigs.debug   // sideloaded over adb; no store signing needed
        }
    }
    lint {
        // Sideloaded over adb, never published to Play.
        disable "ExpiredTargetSdkVersion"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// No dependencies on purpose: framework Views only, to keep idle memory low.
